<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Yago Dias dos Santos — Back-end, APIs e IA">
  <style>
    .blob { transform-box: fill-box; transform-origin: center; }
    .b1 { animation: drift1 14s ease-in-out infinite alternate; }
    .b2 { animation: drift2 18s ease-in-out infinite alternate; }
    .glow { animation: pulse 3.2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .line { stroke-dasharray: 60 940; animation: run 5s linear infinite; }
    .title { font: 800 58px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
    .sub { font: 600 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #e9d5ff; }
    .mono { font: 500 17px 'Fira Code', Consolas, 'Courier New', monospace; fill: #c4b5fd; }
    .accent { fill: #e040fb; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(140px, 30px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-160px, -25px); } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#e040fb"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a1446" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="#0d0117"/>
    <rect width="1000" height="280" fill="url(#grid)" opacity=".45"/>
    <circle class="blob b1" cx="230" cy="90" r="120" fill="#7c3aed" opacity=".45" filter="url(#blur)"/>
    <circle class="blob b2" cx="790" cy="200" r="130" fill="#e040fb" opacity=".32" filter="url(#blur)"/>

    <text class="title glow" x="500" y="122" text-anchor="middle" fill="url(#neon)" filter="url(#soft)">Yago Dias dos Santos</text>
    <text class="title" x="500" y="122" text-anchor="middle" fill="url(#neon)">Yago Dias dos Santos</text>

    <text class="sub" x="500" y="168" text-anchor="middle">BACK-END <tspan class="accent">·</tspan> APIs <tspan class="accent">·</tspan> IA <tspan class="accent">·</tspan> PYTHON <tspan class="accent">·</tspan> JAVA</text>

    <text class="mono" x="500" y="214" text-anchor="middle"><tspan class="accent">&gt;</tspan> procurando estágio em engenharia de software<tspan class="cursor accent">_</tspan></text>

    <line x1="0" y1="276" x2="1000" y2="276" stroke="#2a1446" stroke-width="3"/>
    <line class="line" x1="0" y1="276" x2="1000" y2="276" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
