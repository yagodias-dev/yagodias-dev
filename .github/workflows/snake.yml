name: Cobrinha dos commits

on:
  schedule:
    - cron: "0 3 * * *" # todo dia, 00:00 em Brasília
  workflow_dispatch: # permite rodar manualmente na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar a animação da cobrinha
        # Fixado no commit da versão v3.5.0
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-neon.svg?palette=github-dark&color_snake=#e040fb&color_dots=#1a0b2e,#3b0764,#6d28d9,#a855f7,#e040fb
            dist/github-snake-light.svg?color_snake=#9d1fb5&color_dots=#ede9fe,#d8b4fe,#a855f7,#7e22ce,#581c87

      - name: Publicar na branch output
        # Fixado no commit da versão v4.2.0
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
